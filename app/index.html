    case 'kid-del': {
      const k = KIDS().find(x => x.id === el.dataset.k); if (!k) break;
      if (!(await ask('Retirer le profil « ' + k.name + ' » ? Ses titres vus, ses notes et ses coups de cœur seront effacés.', 'Retirer'))) break;
      S.kids = KIDS().filter(x => x.id !== k.id); S.films.forEach(x => { if (x.kids && x.kids[k.id]) { x.kids = Object.assign({}, x.kids); delete x.kids[k.id]; } });
      if (UI.kid === k.id) setWho(''); save(); render(); break;
    }
    case 'print-go': if (IS_WEB) printDownload(); else window.print(); break;
    case 'print-dl': printDownload(); break;
    case 'owned': if (f) { f.owned = !f.owned; if (f.owned && !f.support && isBook(f)) f.support = f.type === 'Série de BD' ? 'Album BD' : 'Livre'; save(); render(); } break;
    case 'vol-own': case 'vol-read': if (f) { const n = +el.dataset.v; const key = act === 'vol-own' ? 'vols' : 'readVols'; const k = act === 'vol-read' && el.dataset.k ? KIDS().find(x => x.id === el.dataset.k) : null;
      if (k) { const cur = new Set(kidRec(f, k).vl || []); cur.has(n) ? cur.delete(n) : cur.add(n); setKid(f, k, {vl: cur.size ? [...cur].sort((a, b) => a - b) : ''}); }
      else { const cur = new Set(f[key] || []); cur.has(n) ? cur.delete(n) : cur.add(n); f[key] = [...cur].sort((a, b) => a - b); if (key === 'vols' && f[key].length) { f.owned = true; if (!f.support) f.support = f.type === 'Série de BD' ? 'Album BD' : 'Livre'; } }
      save(); render(); } break;
    case 'delete': {
      const film = byId(el.dataset.id); if (!film) break;
      if (!(await ask('Supprimer « ' + film.title + ' » de ta base ? Ta note et tes remarques sur ce film seront effacées.', 'Supprimer'))) break;
      S.films = S.films.filter(x => x.id !== film.id); S.lists.forEach(l => { l.ids = l.ids.filter(i => i !== film.id); });
      save(); toast('« ' + film.title + ' » supprimé'); location.hash = '#/catalogue'; break;
    }
    case 'complete': {
      const film = byId(el.dataset.id); if (!film) break;
      el.disabled = true; el.innerHTML = '<span class="spin"></span> Recherche sur TMDB…';
      try { await completeFromTmdb(film); toast('Fiche complétée avec TMDB'); }
      catch (e) { toast(e.message); }
      render(); break;
    }
    case 'ex-open': case 'ex-add': {
      const id = +el.dataset.id; el.disabled = true;
      try {
        const film = await importTmdb(id, EX.kind);
        if (act === 'ex-open') location.hash = '#/film/' + film.id;
        else { toast('« ' + film.title + ' » ajouté à ta base'); paintEx(); }
      } catch (e) { toast(e.message); el.disabled = false; }
      break;
    }
    case 'ex-page': EX.page = Math.max(1, Math.min(EX.pages, EX.page + +el.dataset.d)); exLoad(); window.scrollTo(0, 0); break;
    case 'coltab': UI.colTab = el.dataset.v; render(); break;
    case 'open': location.hash = '#/film/' + el.dataset.id; break;
    case 'csv': exportCsv(el.dataset.all === '1'); break;
    case 'rename-list': {
      const l = S.lists.find(x => x.id === route().id); if (!l) break;
      $('#rename-zone').innerHTML = `<form id="renameform" class="row" style="align-items:flex-end"><label class="field" style="flex:1 1 260px"><span>Nouveau nom</span><input class="inp" id="rename-name" value="${h(l.name)}" maxlength="60"></label><button class="btn primary" type="submit">Enregistrer</button></form>`;
      $('#rename-name').focus(); $('#rename-name').select(); break;
    }
    case 'del-list': {
      const l = S.lists.find(x => x.id === route().id); if (!l) break;
      if (!(await ask('Supprimer la liste « ' + l.name + ' » ? Les films restent dans ta base.', 'Supprimer la liste'))) break;
      S.lists = S.lists.filter(x => x.id !== l.id); save(); toast('Liste supprimée'); location.hash = '#/listes'; break;
    }
    case 'rm-from-list': { const l = S.lists.find(x => x.id === route().id); if (l) { l.ids = l.ids.filter(i => i !== el.dataset.id); save(); render(); } break; }
    case 'del-key': S.tmdbKey = ''; EX.loaded = false; save(); render(); toast('Clé TMDB retirée'); break;
    case 'backup': {
      const {over, deleted} = computeOver();
      const data = {app: 'Toons & Bulles', v: 2, date: today(), over, deleted, lists: S.lists, kids: S.kids, games: S.games || {}, images: IMAGES};
      if (!IS_WEB) { data.posters = POSTERS; data.free = FREE; }
      if (!IS_WEB && S.tmdbKey) data.tmdbKey = S.tmdbKey;
      if (!IS_WEB && CLAUDE_KEY) data.claudeKey = CLAUDE_KEY;
      if (await download('toons-et-bulles-sauvegarde-' + today() + '.json', JSON.stringify(data, null, 1), 'application/json')) toast('Sauvegarde téléchargée');
      break;
    }
    case 'reset': {
      if (!(await ask('Tout remettre à zéro ? Ta collection, tes listes, tes modifications et les titres ajoutés seront effacés. Pense à exporter une sauvegarde avant.', 'Tout effacer'))) break;
      const key = S.tmdbKey, kids = S.kids; S = initialState(); S.tmdbKey = key; S.kids = kids; HAY.clear(); save(); toast('Base remise à zéro'); location.hash = '#/catalogue'; render(); break;
    }
  }
});

/* =========================================================
   Saisies (champs, cases, formulaires)
   ========================================================= */
let notesTimer, qTimer;
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') {
    UI.q = t.value; UI.limit = PAGE;
    if (route().name !== 'catalogue') location.hash = '#/catalogue';
    else { clearTimeout(qTimer); qTimer = setTimeout(paintCatGrid, 150); }
  } else if (t.id === 'scan-q') {
    SCAN.q = t.value; const z = $('#scan-res'); if (z) z.innerHTML = scanResults();
  } else if (t.dataset.ch === 'notes') {
    const f = currentFilm(); if (!f) return;
    f.notes = t.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 400);
  } else if (t.id === 'ex-vote') {
    $('#ex-vote-v').textContent = +t.value ? fmtNote(+t.value) : 'aucune';
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target, ch = t.dataset.ch, f = currentFilm();
  if (ch === 'sub') { t.checked ? UI.subs.add(t.value) : UI.subs.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'ed') { t.checked ? UI.eds.add(t.value) : UI.eds.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'coll') { t.checked ? UI.colls.add(t.value) : UI.colls.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'tech') { t.checked ? UI.techs.add(t.value) : UI.techs.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'pub') { t.checked ? UI.pubs.add(t.value) : UI.pubs.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'type') { t.checked ? UI.types.add(t.value) : UI.types.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'flag') { UI[t.dataset.k] = t.checked; UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'sort') { UI.sort = t.value; UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'support' && f) { f.support = t.value; save(); }
  else if (ch === 'watched' && f) { f.watchedDate = t.value; save(); }
  else if (ch === 'who') { setWho(t.value); UI.limit = PAGE; render(); }
  else if (ch === 'kid-ep' && f) { const k = KIDS().find(x => x.id === t.dataset.k); if (k) { setKid(f, k, {[t.dataset.f]: +t.value || 0}); save(); toast(k.name + ' : saison ' + (kidRec(f, k).se || '?') + ', épisode ' + (kidRec(f, k).ep || '?')); } }
  else if (ch === 'printsel') { UI.printSel = t.value; render(); }
  else if (ch === 'inlist' && f) {
    const l = S.lists.find(x => x.id === t.value); if (!l) return;
    if (t.checked) { if (!l.ids.includes(f.id)) l.ids.push(f.id); } else l.ids = l.ids.filter(i => i !== f.id);
    save(); toast(t.checked ? 'Ajouté à « ' + l.name + ' »' : 'Retiré de « ' + l.name + ' »');
  } else if (t.id === 'own-img' && t.files && t.files[0] && f) {
    const file = t.files[0]; t.value = '';
    setOwnImage(f, file).then(() => { toast('Photo ajoutée'); render(); }).catch(e => toast(e.message || 'Impossible d\'enregistrer la photo.'));
  } else if (t.id === 'restore-file' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const data = JSON.parse(rd.result);
        const st = stateFrom(data);
        if (!st) throw new Error();
        const nMod = data.over ? Object.keys(data.over).length : (data.films || []).length;
        if (!(await ask('Remplacer ta collection actuelle par cette sauvegarde (' + nMod + ' fiche' + (nMod > 1 ? 's' : '') + ' avec tes notes ou modifications, ' + st.lists.length + ' liste' + (st.lists.length > 1 ? 's' : '') + ') ?', 'Remplacer'))) return;
        const key = S.tmdbKey;
        st.tmdbKey = IS_WEB ? '' : (st.tmdbKey || key);
        S = st; HAY.clear(); save(); EX.loaded = false;
        if (data.posters && typeof data.posters === 'object' && !IS_WEB) { POSTERS = Object.assign({}, POSTERS, data.posters); savePosters(); }
        if (data.free && typeof data.free === 'object' && !IS_WEB) { FREE = Object.assign({}, FREE, data.free); saveFree(); }
        if (!IS_WEB && typeof data.claudeKey === 'string' && /^sk-ant-/.test(data.claudeKey)) { CLAUDE_KEY = data.claudeKey; try { localStorage.setItem(CLAUDE_KEY_STORE, CLAUDE_KEY); } catch (e) { /* rien */ } }
        if (data.images && typeof data.images === 'object') {
          for (const [id, img] of Object.entries(data.images)) {
            if (typeof img === 'string' && img.startsWith('data:image/')) { try { await imgStore.put(id, img); IMAGES[id] = img; } catch (e) { /* on continue */ } }
          }
        }
        toast('Sauvegarde restaurée'); render();
      } catch (e) { toast("Ce fichier n'est pas une sauvegarde Toons & Bulles (ou Ciné Toons) valide."); }
    };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('submit', async (ev) => {
  const t = ev.target; ev.preventDefault();
  if (t.id === 'ed-form') saveEditor();
  else if (t.id === 'ex-form') {
    EX.kind = $('#ex-kind').value; EX.q = $('#ex-q').value; EX.dec = $('#ex-dec').value; EX.sort = $('#ex-sort').value; EX.vote = +$('#ex-vote').value; EX.only = $('#ex-only').checked; EXJP.v = $('#ex-jp').checked; EX.page = 1;
    exLoad();
  } else if (t.id === 'newlist') {
    const name = $('#newlist-name').value.trim(); if (!name) { $('#newlist-name').focus(); return; }
    const l = {id: uid(), name, ids: []}; S.lists.push(l); save(); toast('Liste « ' + name + ' » créée'); location.hash = '#/listes/' + l.id;
  } else if (t.id === 'renameform') {
    const l = S.lists.find(x => x.id === route().id); const name = $('#rename-name').value.trim();
    if (l && name) { l.name = name; save(); render(); toast('Liste renommée'); }
  } else if (t.id === 'kidsform') {
    S.kids = KIDS().map(k => ({id: k.id, name: ($('#kn-' + k.id).value.trim() || k.name).slice(0, 30), age: +$('#ka-' + k.id).value || k.age}));
    save(); toast('Profils enregistrés'); render();
  } else if (t.id === 'loanform') {
    const f = currentFilm(); const to = $('#loan-to').value.trim();
    if (f && to) { f.loan = {to, date: $('#loan-date').value || today()}; save(); toast('Prêt enregistré'); render(); }
  } else if (t.id === 'eanform') {
    const f = currentFilm(); const c = $('#ean-new').value.replace(/\s+/g, '');
    if (f && c) { const other = S.films.find(x => x !== f && (x.ean || []).includes(c)); if (other) { toast('Ce code est déjà associé à « ' + other.title + ' »'); return; } f.ean = [...new Set([...(f.ean || []), c])]; save(); render(); }
  } else if (t.id === 'bo-form') {
    BO.q = $('#bo-q').value; if (BO.q.trim()) boSearch();
  } else if (t.id === 'scanform') {
    scanCode($('#scan').value);
  } else if (t.id === 'tonightform') {
    drawTonight();
  } else if (t.id === 'keyform') {
    const key = $('#tmdbkey').value.trim(), msg = $('#keymsg');
    if (!key) { msg.textContent = 'Colle d\'abord ta clé dans le champ.'; return; }
    const old = S.tmdbKey; S.tmdbKey = key; msg.innerHTML = '<span class="spin"></span> Test de la clé…';
    try { await tmdb('/configuration'); EX.loaded = false; save(); render(); toast('Clé TMDB enregistrée : tous les dessins animés sont disponibles'); }
    catch (e) { S.tmdbKey = old; msg.textContent = e.message; }
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeEditor(); });

document.addEventListener('error', (ev) => {
  const t = ev.target; if (!t || t.tagName !== 'IMG') return;
  if (t.dataset.title) { const sp = document.createElement('span'); sp.className = 'poster-title'; sp.textContent = t.dataset.title; t.replaceWith(sp); }
  else t.remove();
}, true);
boot();
</script>
