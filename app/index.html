<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Toons &amp; Bulles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* Salle de projection du samedi matin : fond bleu nuit d'écran cathodique, jaune « cellulo », corail.
   En-tête fixe, filtres à gauche, grille d'affiches fluide. Une seule ambiance sombre, choisie exprès. */
:root{
  --bg:#0F1426; --surface:#161D36; --raised:#202A4A; --line:#2A3558; --line2:#3A4775;
  --fg:#EEF1FB; --soft:#CBD3EE; --muted:#A3AEDA; --dim:#8590BE;
  --accent:#FFC93C; --accent-soft:#FFE08A; --accent-deep:#3A3216;
  --coral:#FF7A5C;
  --good:#1F6B55; --good-fg:#E3FBF2; --wait:#5A3A2E; --danger:#D9534F;
  --display:'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
a{color:var(--accent-soft)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}
.label{margin:0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand span{font-family:var(--display);font-weight:700;font-size:24px}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main a{padding:10px 14px;border-radius:6px;color:var(--fg);text-decoration:none}
nav.main a:hover{background:var(--raised)}
nav.main a.on{background:var(--accent-deep);color:var(--accent-soft);font-weight:600}
.search{flex:1 1 280px;display:flex;justify-content:flex-end}
.search label{display:flex;align-items:center;gap:10px;width:100%;max-width:440px;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent}
.search input::placeholder,input::placeholder,textarea::placeholder{color:var(--dim)}

.wrap{padding:24px;max-width:1500px;margin:0 auto}
.layout{display:flex;flex-wrap:wrap;gap:32px}
.filters{flex:1 1 220px;max-width:260px;display:flex;flex-direction:column;gap:24px}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.fgroup{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.check{display:flex;align-items:center;gap:10px;min-height:32px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.check .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1.title{margin:0;font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.head-row p{margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:8px;background:transparent;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent);background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-fg);font-weight:600}
.btn.wait{background:var(--coral);border-color:var(--coral);color:#1A0E0A;font-weight:700}
.btn.danger{border-color:var(--danger);color:#F2B8A8}
.btn.danger:hover{background:var(--danger);color:var(--fg)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
select.sel,input.inp,textarea.inp{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
input.inp{width:100%}
label.inline{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border:0;background:transparent;cursor:pointer;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--soft);text-decoration:none}
.tab.on{color:var(--accent-soft);font-weight:600;border-bottom-color:var(--accent)}

/* Grille d'affiches */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:6px;color:var(--fg);text-decoration:none;min-width:0}
.poster{position:relative;display:flex;align-items:flex-end;aspect-ratio:2/3;max-width:100%;border-radius:8px;padding:12px;border:1px solid var(--line2);overflow:hidden;width:100%}
button.poster{cursor:pointer;text-align:left;color:inherit;font:inherit}
.card:hover .poster,button.poster:hover{border-color:var(--accent)}
.poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster-title{position:relative;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;color:#FFFFFF;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pill{position:absolute;z-index:1;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.3px}
.pill.note{top:8px;right:8px;background:var(--bg);color:var(--accent-soft)}
.pill.vu{top:8px;left:8px;background:var(--good);color:var(--good-fg)}
.pill.avoir{top:8px;left:8px;background:var(--coral);color:#1A0E0A}
.pill.own{bottom:8px;right:8px;background:var(--bg);color:var(--soft)}
.pill.free{bottom:8px;left:8px;background:var(--good);color:var(--good-fg)}
.watch{display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.watch h2{margin:0}
.watch .row{gap:8px}
.watch .free-now{margin:0;padding:10px 14px;border-radius:8px;background:var(--good);color:var(--good-fg);font-weight:600}
.watch .hint{margin:0;font-size:13px;color:var(--dim)}
.who{display:flex;align-items:center;gap:8px}
.who select{height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.pill.fav{bottom:8px;right:8px;background:var(--coral);color:#1A0E0A}
.kids{display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.kidrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:6px;border-top:1px solid var(--line)}
.kidrow:first-of-type{border-top:0}
.kidrow b{min-width:110px}
.kidrow .inp.num{width:64px;height:36px}
.saga{display:flex;flex-direction:column;gap:10px}
.saga ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.saga li.on{font-weight:700;color:var(--accent-soft)}
.saga .done{color:var(--good-fg);background:var(--good);border-radius:4px;padding:1px 6px;font-size:12px;margin-left:6px}
.sagarow{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.sagarow .poster{padding:8px}
.sagarow .poster-title{font-size:14px}
.sagarow .num{position:absolute;top:6px;left:6px;z-index:1;background:var(--bg);color:var(--accent-soft);border-radius:4px;padding:1px 7px;font-weight:700;font-size:13px}
.tonight{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
.tonight .poster{max-width:150px}
@media (max-width:640px){.tonight{grid-template-columns:1fr}.tonight .poster{max-width:200px}}
.scanbox{display:flex;flex-direction:column;gap:14px;max-width:760px}
.scanbox input.big{height:60px;font-size:22px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.loanwarn{padding:12px 16px;border-radius:8px;background:var(--wait);color:var(--fg)}
.printpage{background:#fff;color:#111;padding:28px;border-radius:10px;font-family:var(--body)}
.printpage h1{margin:0 0 4px;font-family:var(--display);font-size:28px;color:#111}
.printpage table{min-width:0;width:100%;border-collapse:collapse;font-size:13px}
.printpage th{background:#eee;color:#333;padding:6px 8px;letter-spacing:.5px}
.printpage td{border-top:1px solid #ccc;padding:5px 8px;color:#111}
@media print{
  header.top,.noprint,#warn,#toast{display:none!important}
  body{background:#fff!important;color:#000!important}
  .wrap{padding:0!important;max-width:none}
  .printpage{padding:0;border-radius:0}
}
.links{display:flex;flex-wrap:wrap;gap:8px 16px}
.card-t{font-weight:600;line-height:1.25}
.card-m{color:var(--muted);font-size:13px}
.empty{padding:40px 24px;border:1px dashed var(--line2);border-radius:10px;text-align:center;color:var(--soft)}
.empty h2{margin:0 0 6px;font-family:var(--display);font-size:22px;color:var(--fg)}

/* Fiche */
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none}
.film{display:flex;flex-wrap:wrap;gap:36px}
.film-side{flex:0 1 300px;display:flex;flex-direction:column;gap:12px;min-width:0}
.film-main{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:20px}
.film-main h1{margin:0;font-family:var(--display);font-size:42px;line-height:1.05}
.film-main .orig{margin:6px 0 0;color:var(--muted);font-style:italic}
.film-main .meta{margin:8px 0 0;color:var(--soft)}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 12px;border-radius:16px;background:var(--raised);border:1px solid var(--line2);font-size:13px}
.panel{display:flex;flex-wrap:wrap;gap:28px;padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.bignum{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent-soft);font-variant-numeric:tabular-nums}
.bignum small{font-size:16px;color:var(--muted)}
.stars{display:flex;gap:2px}
.star{width:40px;height:40px;border:0;background:transparent;padding:0;cursor:pointer}
.cast{display:flex;flex-wrap:wrap;gap:10px}
.person{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px 6px 6px;border-radius:24px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;cursor:pointer}
.person:hover{border-color:var(--accent)}
.ini{width:34px;height:34px;border-radius:50%;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--accent-soft);flex:none}
.person b{display:block;font-size:14px}
.person i{display:block;font-style:normal;color:var(--muted);font-size:12px}
.two{display:flex;flex-wrap:wrap;gap:24px}
.two > *{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.synopsis{margin:0;line-height:1.6;color:var(--soft);max-width:70ch}

/* Tableaux & stats */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:720px;border-collapse:collapse}
th{padding:12px 16px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;background:var(--surface)}
td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface)}
.thumb{width:36px;height:54px;border-radius:4px;flex:none;object-fit:cover;border:1px solid var(--line2)}
.cellfilm{display:flex;align-items:center;gap:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:4px;font-size:13px;font-weight:600}
.badge.vu{background:var(--good);color:var(--good-fg)}
.badge.avoir{background:var(--coral);color:#1A0E0A}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tile .bignum{font-size:32px}
.tile small{color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;font-size:14px}
.bar .track{height:14px;border-radius:7px;background:var(--raised);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.box{padding:20px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{margin:0;font-family:var(--display);font-size:22px}

/* Listes */
.listnav{flex:1 1 240px;max-width:300px;display:flex;flex-direction:column;gap:8px}
.listlink{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:0 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.listlink:hover{border-color:var(--accent)}
.listlink.on{border-color:var(--accent);background:var(--accent-deep)}
.listlink span:last-child{color:var(--muted);font-size:13px}

/* Fenêtre d'édition */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,9,20,.78);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.modal h2{margin:0;font-family:var(--display);font-size:26px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:13px;color:var(--muted);font-weight:500}
.field .hint{font-size:12px;color:var(--dim)}
.err{color:#F2B8A8;font-size:14px;min-height:1em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:8px;background:var(--raised);border:1px solid var(--accent);color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.warn{padding:12px 16px;border-radius:8px;background:var(--wait);color:var(--accent-soft);margin-bottom:16px}
.note-box{padding:16px 18px;border-radius:10px;background:var(--surface);border:1px solid var(--line);line-height:1.6}
.note-box ol{margin:8px 0 0;padding-left:20px}
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:8px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:640px){
  .wrap{padding:16px}
  header.top{padding:12px 16px}
  .filters,.listnav{max-width:none}
  .form{grid-template-columns:1fr}
  .film-main h1{font-size:32px}
  .bar{grid-template-columns:100px 1fr 32px}
}

/* Quiz, musique */
.quizbox{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;background:var(--accent-deep);border:1px solid var(--accent)}
.quizbox.locked{background:var(--surface);border:1px dashed var(--line2)}
.lockico{color:var(--muted);display:inline-flex}
.qz-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;background:var(--bg);font-size:13px}
.qz-wrap{display:flex;flex-direction:column;gap:18px;max-width:860px;margin:0 auto}
.qz-head{display:flex;align-items:center;gap:16px}
.qz-poster{width:70px;flex:0 0 70px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);font-size:11px;text-align:center}
.qz-poster img{width:100%;height:100%;object-fit:cover}
.qz-poster .poster-title{font-size:11px;padding:4px;line-height:1.15;overflow:hidden}
.qz-card{padding:22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.qz-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.qz-bar,.mq-time{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.qz-bar span,.mq-time span{display:block;height:100%;background:var(--accent);transition:width .4s}
.mq-time span{background:var(--coral);transition:width 1s linear}
.qz-turn{margin:0;font-family:var(--display);font-size:22px;color:var(--coral)}
.qz-q{margin:0;font-family:var(--display);font-size:24px;line-height:1.25;text-align:center}
.qz-ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.qz-ans{grid-template-columns:1fr}.qz-q{font-size:20px}}
.qz-btn{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:10px;border:2px solid var(--line2);background:var(--raised);cursor:pointer;text-align:left;font-size:16px;font-weight:600}
.qz-btn:hover:not([disabled]){border-color:var(--accent)}
.qz-btn.good{background:var(--good);border-color:#3FB68B;color:var(--good-fg)}
.qz-btn.bad{background:#5C2626;border-color:var(--danger)}
.qz-btn.off{opacity:.55}
.qz-btn[disabled]{cursor:default}
.qz-l{flex:0 0 30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--bg);color:var(--accent-soft);font-family:var(--display)}
.qz-fb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:10px}
.qz-fb.ok{background:var(--good);color:var(--good-fg)}
.qz-fb.ko{background:var(--wait);color:var(--accent-soft)}
.qz-end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qz-big{font-family:var(--display);font-size:64px;font-weight:800;color:var(--accent);line-height:1}
.qz-big small{font-size:24px;color:var(--muted)}
.qz-board{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.qz-rank{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;background:var(--raised);text-align:left}
.qz-rank b{flex:1}
.qz-rank.win{background:var(--accent-deep);border:1px solid var(--accent)}
.qz-newt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.trophy{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;opacity:.6}
.trophy.on{opacity:1;border-color:var(--accent);background:var(--accent-deep)}
.trophy span{font-size:12px;color:var(--muted)}
.qz-games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.qz-game{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);color:var(--fg);text-decoration:none}
.qz-game:hover{border-color:var(--accent);background:var(--raised)}

<script>
'use strict';
/* =========================================================
   Classements (modifiables sur chaque fiche)
   ========================================================= */
const STUDIOS = ['Disney', 'Pixar', 'DreamWorks', 'Warner Bros. / Looney Tunes', 'MGM / Tom et Jerry', 'Hanna-Barbera', 'Cartoon Network', 'Nickelodeon',
  'Illumination', 'Blue Sky', 'Sony Animation', 'Universal / Amblin', 'Paramount', '20th Century / Fox', 'Laika', 'Aardman', 'Netflix',

const SUB_LIST = STUDIOS;
const BOOK_TYPES = ['Série de BD', 'Série de livres', 'Album', 'Roman', 'Magazine'];
const TYPES = ['Film', 'Série', 'Mini-série', 'Téléfilm / spécial', 'Court métrage'].concat(BOOK_TYPES);
const TYPE_PLURAL = {'Série de BD':'Séries de BD', 'Série de livres':'Séries de livres', 'Album':'Albums', 'Roman':'Romans', 'Magazine':'Magazines', 'Film':'Films', 'Série':'Séries', 'Mini-série':'Mini-séries', 'Téléfilm / spécial':'Téléfilms et spéciaux', 'Court métrage':'Courts métrages'};
const TECHS = ['Bande dessinée', 'Livre illustré', 'Roman', 'Magazine', 'Dessin animé (2D)', 'Images de synthèse (3D)', 'Stop-motion / pâte à modeler', 'Animation + prises de vue réelles', 'Papier découpé / ombres / autres', 'Non précisé'];

  'Hanna-Barbera':'#5B3F8C','Cartoon Network':'#2E2E36','Nickelodeon':'#B4521F','Illumination':'#8C7A1C','Blue Sky':'#2F6A9E','Sony Animation':'#6A2F5E',
  'Universal / Amblin':'#3C4A6E','Paramount':'#24508A','20th Century / Fox':'#6E5A2A','Laika':'#4A3A5E','Aardman':'#6E4A2E','Netflix':'#7A1F26',
  'Fleischer / Popeye':'#4E5A2E','Animation française':'#26407A','Animation européenne':'#2E5E5A','Animés et style japonais':'#9C2F4A','BD franco-belge':'#B0602A','BD jeunesse':'#C2453A','Comics et strips':'#3E6E3A','Albums et premières lectures':'#6A4C9C','Romans jeunesse':'#2E6A7A','Documentaires jeunesse':'#5A6A2A','Grands classiques':'#6E3A2A','Premières lectures':'#7A5A1E','Magazines jeunesse':'#2E5A8A','Autres studios':'#3A4466','Non classé':'#3A4466'};
const SUPPORTS = ['Blu-ray','DVD','4K UHD','Numérique','VHS','Livre','Album BD','Liseuse','Autre'];

/* =========================================================
   Outils
   ========================================================= */
const STORE_KEY = 'cinetoons-v1';
const IMG = 'https://image.tmdb.org/t/p/';
const $ = (s, r = document) => r.querySelector(s);
const h = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const decadeOf = (y) => (y ? Math.floor(+y / 10) * 10 : null);
const fmtNote = (n) => (n == null || n === '' ? '' : String(Math.round(n * 10) / 10).replace('.', ','));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => (d ? d.split('-').reverse().join('/') : '');
const initials = (n) => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const tone = (f) => TONES[f.subgenre] || TONES['Non classé'];
const isWebUrl = (u) => /^https?:/i.test(u || '');
const COUNTRY = {US:'États-Unis',IT:'Italie',ES:'Espagne',FR:'France',DE:'Allemagne',GB:'Royaume-Uni',MX:'Mexique',CA:'Canada',AU:'Australie',NZ:'Nouvelle-Zélande',JP:'Japon',BE:'Belgique',DK:'Danemark',NO:'Norvège',SE:'Suède',AR:'Argentine',BR:'Brésil',IE:'Irlande',ZA:'Afrique du Sud',KR:'Corée du Sud',CN:'Chine',HU:'Hongrie',CZ:'Tchéquie',PL:'Pologne',AT:'Autriche',CH:'Suisse',NL:'Pays-Bas'};

function blankFilm() {
  return {id: uid(), tmdbId: null, tmdbType: '', title: '', originalTitle: '', year: '', endYear: '', type: 'Film', director: '', country: '', subgenre: 'Non classé',
    technique: 'Non précisé', public: 'Famille', pd: false, age: 6, awards: '', vf: '', seasons: null, episodes: null,
    kids: {}, loan: null, ean: [], publisher: '', volumes: null, vols: [], readVols: [], eanT: {}, coll: '',
    runtime: null, cast: [], synopsis: '', synLang: '', poster: '', tmdbNote: null, trailer: '', providers: '', providersLink: '', wiki: '', imdb: '',
    status: '', owned: false, support: '', myNote: 0, watchedDate: '', notes: '', addedAt: Date.now()};
}
/* ---------- Catalogue (fichier catalogue.js, en lecture seule) ----------
   Ce qui est enregistré ne contient que les fiches modifiées, ajoutées ou supprimées. */
const CAT = (() => {
  const rows = window.CT_CATALOG, fields = window.CT_FIELDS;
  if (!Array.isArray(rows) || !Array.isArray(fields)) return [];
  return rows.map(r => {
    const o = {}; fields.forEach((k, i) => { o[k] = r[i] == null ? '' : r[i]; });
    return Object.assign(blankFilm(), {
      id: o.id, title: o.title, originalTitle: o.originalTitle, year: String(o.year || ''), endYear: String(o.endYear || ''),
      type: o.type || 'Film', director: o.director, country: o.country, subgenre: o.subgenre || 'Non classé',
      cast: o.cast ? String(o.cast).split('|').map(n => ({name: n, role: ''})) : [],
      technique: o.technique || 'Non précisé', public: o.public || 'Famille', poster: o.poster || '', pd: !!o.pd,
      age: +o.age || 6, awards: o.awards || '', vf: o.vf || '', publisher: o.publisher || '', volumes: +o.volumes || null, coll: o.coll || '',
      synopsis: o.synopsis, synLang: '', wiki: o.wiki, imdb: o.imdb || '', addedAt: 0
    });
  });
})();
const CAT_BY_ID = new Map(CAT.map(f => [f.id, f]));
const CAT_JSON = new Map(CAT.map(f => [f.id, JSON.stringify(f)]));
const USER_KEYS = ['status', 'owned', 'support', 'myNote', 'watchedDate', 'notes', 'kids', 'loan', 'ean', 'vols', 'readVols', 'eanT'];
const isBlank = (v) => v == null || v === '' || (Array.isArray(v) && !v.length);
function mergeFilm(cat, ov) {
  const r = Object.assign({}, cat, ov);
  Object.keys(cat).forEach(k => { if (k !== 'id' && k !== 'synLang' && !USER_KEYS.includes(k) && isBlank(ov[k]) && !isBlank(cat[k])) r[k] = cat[k]; });
  r.synLang = !isBlank(ov.synopsis) && ov.synopsis !== cat.synopsis ? (ov.synLang || '') : cat.synLang;
  return r;
}
/* Reconstruit la liste complète : catalogue + fiches modifiées/ajoutées − fiches supprimées */
function assemble(over, deleted) {
  const del = new Set(deleted || []);
  const films = [];
  CAT.forEach(c => { if (del.has(c.id)) return; const o = over[c.id]; films.push(o ? mergeFilm(c, Object.assign(blankFilm(), o)) : Object.assign({}, c)); });
  Object.keys(over).forEach(id => { if (!CAT_BY_ID.has(id) && !del.has(id)) films.push(Object.assign(blankFilm(), over[id])); });
  return films;
}
function computeOver() {
  const over = {}, present = new Set();
  S.films.forEach(f => { present.add(f.id); if (CAT_JSON.get(f.id) !== JSON.stringify(f)) over[f.id] = f; });
  const deleted = CAT.filter(c => !present.has(c.id)).map(c => c.id);
  return {over, deleted};
}
function defaultLists() {
  const pick = (titles) => titles.map(t => { const f = CAT.find(c => c.title === t[0] && c.year === t[1]); return f && f.id; }).filter(Boolean);
  return [
    {id: uid(), name: 'Les grands classiques Disney', ids: pick([['Blanche-Neige et les Sept Nains', '1937'], ['Pinocchio', '1940'], ['Dumbo', '1941'], ['Bambi', '1942'], ['Cendrillon', '1950'], ['Peter Pan', '1953'], ['La Belle et le Clochard', '1955'], ['Les 101 Dalmatiens', '1961'], ['Le Livre de la jungle', '1967'], ['Les Aristochats', '1970'], ['Robin des Bois', '1973'], ['Le Roi lion', '1994']])},
    {id: uid(), name: 'Soirée film en famille', ids: pick([['Toy Story', '1995'], ['Le Monde de Nemo', '2003'], ['Ratatouille', '2007'], ['Dragons', '2010'], ['Moi, moche et méchant', '2010'], ['Zootopie', '2016'], ['Coco', '2017']])},
    {id: uid(), name: 'Souvenirs de Récré A2 et du Club Dorothée', ids: pick([['Goldorak', '1975'], ['Albator, le corsaire de l\'espace', '1978'], ['Capitaine Flam', '1978'], ['Candy', '1976'], ['Tom Sawyer', '1980'], ['Ulysse 31', '1981'], ['Les Mystérieuses Cités d\'or', '1982'], ['Heidi', '1974'], ['Rémi sans famille', '1977'], ['Les Chevaliers du Zodiaque', '1986'], ['Dragon Ball', '1986'], ['Olive et Tom', '1983']])},
    {id: uid(), name: 'Histoires du soir', ids: pick([['Le Gruffalo (album)', '1999'], ['La Chenille qui fait des trous', '1969'], ['Petit Bleu et Petit Jaune', '1959'], ['Max et les Maximonstres', '1963'], ['Ernest et Célestine (albums)', '1981'], ['Les Contes de la rue Broca', '1967'], ['Contes de Perrault', '1697']])},
    {id: uid(), name: 'À voir avec les enfants', ids: []}
  ];
}
function defaultKids() { return [{id: 'k1', name: 'Enfant 1', age: 5}, {id: 'k2', name: 'Enfant 2', age: 8}, {id: 'k3', name: 'Enfant 3', age: 10}]; }
const kidsFrom = (arr) => Array.isArray(arr) && arr.length ? arr.map(k => ({id: String(k.id || uid()), name: String(k.name || 'Enfant'), age: +k.age || 6})) : defaultKids();
function initialState() { return {v: 2, films: assemble({}, []), lists: defaultLists(), tmdbKey: '', kids: defaultKids(), games: gamesFrom(null)}; }
/* Accepte le format actuel (v2 : over/deleted) et l'ancien (v1 : liste complète des films) */
function stateFrom(data) {
  if (!data) return null;
  const lists = Array.isArray(data.lists) ? data.lists.map(l => ({id: l.id || uid(), name: l.name || 'Liste', ids: [...(l.ids || [])]})) : [];
  if (data.over && typeof data.over === 'object') return {v: 2, films: assemble(data.over, data.deleted || []), lists, tmdbKey: data.tmdbKey || '', kids: kidsFrom(data.kids), games: gamesFrom(data.games)};
  if (Array.isArray(data.films)) {
    const over = {}; data.films.forEach(f => { if (f && f.id) over[f.id] = f; });
    const deleted = [];
    return {v: 2, films: assemble(over, deleted), lists, tmdbKey: data.tmdbKey || '', kids: kidsFrom(data.kids), games: gamesFrom(data.games)};
  }
  return null;
}

/* =========================================================
   Sauvegarde : navigateur / application de bureau (localStorage)
   ou page Claude (stockage en ligne « db »)
   ========================================================= */
const IS_WEB = !!(window.claude && typeof window.claude.use === 'function');
const WEB_BOOKS_MSG = "Dans la version en ligne sur Claude, la page n'a pas le droit de contacter d'autres sites : la recherche de livres (Google Livres), le titre automatique au scan d'un ISBN et les couvertures automatiques ne marchent que dans l'application installée sur ton Mac ou ton PC.";
const WEB_TMDB_MSG = "Dans la version en ligne sur Claude, la page n'a pas le droit de contacter d'autres sites : la base TMDB (tous les dessins animés, affiches, résumés en français, plateformes) et les affiches de Wikipédia n'y sont donc pas disponibles. Utilise l'application installée sur ton Mac ou ton PC pour explorer TMDB, puis transfère ta collection ici avec Réglages › Exporter / Restaurer une sauvegarde.";
let MODE = 'local';          // 'local' ou 'db'
let DB = null, dbTimer = null, saveTimer = null, dbBusy = false, dbAgain = false, dbErr = '';
const written = new Map();   // film id -> JSON enregistré en ligne
let metaWritten = '';
let storageOk = true;
const STORE_V2 = 'cinetoons-v2';
function load() {
  try {
    const raw2 = localStorage.getItem(STORE_V2);
    if (raw2) return stateFrom(JSON.parse(raw2));
    const raw1 = localStorage.getItem(STORE_KEY);
    if (raw1) return stateFrom(JSON.parse(raw1));
    return null;
  } catch (e) { storageOk = false; return null; }
}
function save() {
  LOCAL_IDX = null;
  if (MODE === 'db') { clearTimeout(dbTimer); dbTimer = setTimeout(flushDb, 300); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const {over, deleted} = computeOver();
      localStorage.setItem(STORE_V2, JSON.stringify({v: 2, over, deleted, lists: S.lists, tmdbKey: S.tmdbKey, kids: S.kids, games: S.games || {}}));
      storageOk = true;
    } catch (e) { storageOk = false; }
    paintWarn();
  }, 120);
}
/* Envoie seulement ce qui a changé : un document par fiche modifiée + un document pour les listes */
async function flushDb() {
  if (dbBusy) { dbAgain = true; return; }
  dbBusy = true;
  const {over, deleted} = computeOver();
  const jobs = [];
  Object.keys(over).forEach(id => { const j = JSON.stringify(over[id]); if (written.get(id) !== j) jobs.push(() => DB.doc('films/' + id).set(JSON.parse(j)).then(() => written.set(id, j))); });
  [...written.keys()].forEach(id => { if (!over[id]) jobs.push(() => DB.doc('films/' + id).delete().then(() => written.delete(id))); });
  const meta = JSON.stringify({v: 2, lists: S.lists, deleted, kids: S.kids, games: S.games || {}});
  if (meta !== metaWritten) jobs.push(() => DB.doc('meta/main').set(JSON.parse(meta)).then(() => { metaWritten = meta; }));
  let failed = null;
  for (let i = 0; i < jobs.length; i += 8) {
    const res = await Promise.allSettled(jobs.slice(i, i + 8).map(fn => fn()));
    res.forEach(r => { if (r.status === 'rejected') failed = r.reason; });
  }
  storageOk = !failed; dbErr = failed ? (failed.code || 'unavailable') : '';
  dbBusy = false; paintWarn();
  if (dbAgain) { dbAgain = false; flushDb(); }
}
function paintWarn() {
  let msg = '';
  if (!storageOk && MODE === 'db') {
    msg = dbErr === 'quota_exceeded' ? 'Le stockage en ligne est plein : supprime quelques fiches modifiées ou utilise l\'application installée.'
      : dbErr === 'invalid_argument' || dbErr === 'revoked' ? 'Tu peux consulter la collection mais pas la modifier depuis ce compte.'
      : 'Enregistrement impossible pour le moment. Ta dernière modification sera renvoyée à la prochaine action ; en attendant, tu peux exporter une sauvegarde (Réglages).';
  } else if (!storageOk) {
    msg = 'Ce navigateur refuse l\'enregistrement automatique. Tes modifications seront perdues à la fermeture : va dans Réglages et clique sur « Exporter une sauvegarde ».';
  }
  $('#warn').innerHTML = msg ? '<div class="warn">' + h(msg) + '</div>' : '';
}
let S = {v: 2, films: [], lists: [], tmdbKey: '', kids: []};
async function boot() {
  if (IS_WEB) {
    $('#view').innerHTML = '<div class="empty"><h2>Ouverture de ta collection…</h2><p><span class="spin"></span></p></div>';
    try { DB = await window.claude.use('db'); } catch (e) { DB = null; }
    if (DB) {
      try {
        const [fs, meta] = await Promise.all([DB.collection('films').get(), DB.doc('meta/main').get()]);
        const over = {};
        fs.docs.forEach(d => { const data = JSON.parse(JSON.stringify(d.data())); over[d.id] = data; written.set(d.id, JSON.stringify(data)); });
        const m = meta.exists ? JSON.parse(JSON.stringify(meta.data())) : null;
        const lists = m && Array.isArray(m.lists) ? m.lists.map(l => ({id: l.id, name: l.name, ids: [...(l.ids || [])]})) : defaultLists();
        S = {v: 2, films: assemble(over, (m && m.deleted) || []), lists, tmdbKey: '', kids: kidsFrom(m && m.kids), games: gamesFrom(m && m.games)};
        metaWritten = m ? JSON.stringify(m) : '';
        MODE = 'db';
      } catch (e) { DB = null; }
    }
    if (MODE !== 'db') S = load() || initialState();
  } else {
    S = load() || initialState();
  }
  /* Ajout unique de la liste « Souvenirs de Récré A2… » pour les collections déjà créées */
  try {
    if (!localStorage.getItem('cinetoons-recre') && !S.lists.some(l => /^Souvenirs de Récré/.test(l.name))) {
      const l = defaultLists().find(x => /^Souvenirs de Récré/.test(x.name)); if (l) S.lists.push(l);
    }
    localStorage.setItem('cinetoons-recre', '1');

const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('cinetoons', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('images');
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('images', mode); const out = fn(tx.objectStore('images')); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); });
  },
  async all() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const out = {}; const req = db.transaction('images').objectStore('images').openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = () => rej(req.error);
    });
  },
  put(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); }
};
const imgStore = {
  async load() {

      if (MODE === 'db') {

      }
      return await IDB.all();
    } catch (e) { return {}; }
  },
  async put(id, data) {
    if (MODE === 'db') return DB.doc('images/' + id).set({data, at: Date.now()});

/* Réduit une image choisie (≈ 400 px de large, JPEG) pour qu'elle reste légère */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) { rej(new Error('Choisis un fichier image (JPEG, PNG, HEIC converti…).')); return; }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const w = Math.min(400, im.naturalWidth), hgt = Math.round(im.naturalHeight * w / im.naturalWidth);
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      c.getContext('2d').drawImage(im, 0, 0, w, hgt);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Cette image n'a pas pu être lue. Essaie une photo au format JPEG ou PNG.")); };
    im.src = url;
  });
}
async function setOwnImage(f, file) {
  const data = await shrinkImage(file);
  await imgStore.put(f.id, data);
  IMAGES[f.id] = data;
}

const httpsUrl = (u) => String(u || '').replace(/^http:/, 'https:').replace('&edge=curl', '');
async function gbooks(q, n = 20) {
  if (IS_WEB) throw new Error(WEB_BOOKS_MSG);
  const u = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&maxResults=' + n + '&printType=books';
  let r;
  try { r = await fetch(u); } catch (e) { throw new Error('Impossible de joindre Google Livres. Vérifie ta connexion Internet.'); }
  if (r.status === 429) throw new Error('Google Livres demande de patienter un peu (trop de recherches). Réessaie dans une minute.');
  if (!r.ok) throw new Error('Google Livres a répondu avec une erreur (' + r.status + ').');
  const d = await r.json();
  return (d.items || []).map(it => {
    const v = it.volumeInfo || {};
    const isbn = ((v.industryIdentifiers || []).find(x => x.type === 'ISBN_13') || (v.industryIdentifiers || []).find(x => x.type === 'ISBN_10') || {}).identifier || '';
    return {id: it.id, title: v.title || '', subtitle: v.subtitle || '', authors: (v.authors || []).join(', '), publisher: v.publisher || '', year: (v.publishedDate || '').slice(0, 4),
      pages: v.pageCount || 0, desc: v.description || '', cats: (v.categories || []).join(', '), lang: v.language || '', isbn,
      cover: httpsUrl((v.imageLinks || {}).thumbnail || (v.imageLinks || {}).smallThumbnail || '')};
  });
}
async function openLibraryIsbn(isbn) {
  try {
    const r = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data');
    const d = (await r.json())['ISBN:' + isbn]; if (!d) return null;
    return {title: d.title || '', subtitle: d.subtitle || '', authors: (d.authors || []).map(a => a.name).join(', '), publisher: ((d.publishers || [])[0] || {}).name || '',
      year: String(d.publish_date || '').match(/\d{4}/) ? String(d.publish_date).match(/\d{4}/)[0] : '', pages: d.number_of_pages || 0, desc: '', isbn,
      cover: httpsUrl((d.cover || {}).medium || '')};
  } catch (e) { return null; }
}
async function lookupIsbn(isbn) {
  try { const g = await gbooks('isbn:' + isbn, 1); if (g[0]) return g[0]; } catch (e) { if (/patienter/.test(e.message)) throw e; }
  return openLibraryIsbn(isbn);
}
/* Devine le nom de la série à partir du titre d'un tome : « Astérix - Tome 3 : … » → « Astérix » */
const seriesGuess = (t) => String(t || '').replace(/\s*[-–:,.]?\s*(tome|t\.|vol\.?|volume|n°)\s*\d+.*$/i, '').replace(/\s*[:–-].*$/, '').trim();
const tomeGuess = (t) => { const m = String(t || '').match(/(?:tome|t\.|vol\.?|volume|n°)\s*(\d+)/i); return m ? +m[1] : 0; };
async function findCover(f) {
  const au = ((f.director || '').split(/,| et | puis /)[0] || '').trim();
  const q = 'intitle:' + f.title.replace(/\s*\((livres?|album|BD|roman|livre)\)$/i, '') + (au && !/collectif|presse|méthode|disney/i.test(au) ? ' inauthor:' + au.split(' ').slice(-1)[0] : '');
  const res = await gbooks(q, 10);
  const want = tkey(f.title.replace(/\s*\(.*\)$/, ''));
  const hit = res.find(x => x.cover && tkey(x.title).includes(want)) || res.find(x => x.cover);
  return hit ? {u: hit.cover, g: hit.id} : 0;
}
function bookFromGoogle(b) {
  const bd = /comic|graphic|bande/i.test(b.cats);
  const type = bd ? 'Série de BD' : b.pages && b.pages <= 48 ? 'Album' : 'Roman';

    subgenre: bd ? 'BD jeunesse' : type === 'Album' ? 'Albums et premières lectures' : 'Romans jeunesse', technique: bd ? 'Bande dessinée' : type === 'Album' ? 'Livre illustré' : 'Roman',
    director: b.authors, publisher: b.publisher, synopsis: b.desc.slice(0, 1200), poster: b.cover, ean: b.isbn ? [b.isbn] : [], age: type === 'Album' ? 3 : 8,
    country: '', public: 'Famille', addedAt: Date.now()});
}

/* --- Recherche automatique des affiches sur TMDB --- */
const RUN = {active: false, stop: false, done: 0, total: 0, found: 0, errors: 0, lastError: ''};
async function findPoster(f) {
  const kind = f.tmdbType || (isTV(f) ? 'tv' : 'movie');
  if (f.tmdbId) {
    const d = await tmdb('/' + kind + '/' + f.tmdbId, {language: 'fr-FR'});
    return d.poster_path ? {p: d.poster_path, t: d.id, k: kind} : 0;
  }
  const titles = [...new Set([f.originalTitle, f.title].filter(Boolean))];
  const want = +f.year || 0;
  const yKey = kind === 'tv' ? 'first_air_date_year' : 'year';
  let best = null, bestScore = -1;
  for (const q of titles) {
    for (const withYear of want ? [true, false] : [false]) {
      const res = await tmdb('/search/' + kind, Object.assign({query: q, language: 'fr-FR', include_adult: 'false'}, withYear ? {[yKey]: want} : {}));
      (res.results || []).forEach(r => {
        const y = +((r.release_date || r.first_air_date || '').slice(0, 4)) || 0;
        if (want && y && Math.abs(y - want) > 1) return;
        const names = [r.title, r.original_title, r.name, r.original_name].filter(Boolean).map(tkey);
        const exact = names.includes(tkey(q));
        const anim = (r.genre_ids || []).includes(16);
        if (!exact && !anim) return;
        const score = (exact ? 4 : 0) + (anim ? 3 : 0) + (y === want ? 2 : 0) + (r.poster_path ? 1 : 0);
        if (score > bestScore) { best = r; bestScore = score; }
      });
      if (best && best.poster_path) break;
    }
    if (best && best.poster_path) break;
  }
  return best && best.poster_path ? {p: best.poster_path, t: best.id, k: kind} : 0;
}
async function runPosters(list) {
  RUN.active = true; RUN.stop = false; RUN.done = 0; RUN.found = 0; RUN.errors = 0; RUN.lastError = '';
  RUN.total = list.length; paintRun();

  const worker = async () => {
    while (!RUN.stop && i < list.length) {
      const f = list[i++];
      try {
        const r = isBook(f) ? await findCover(f) : await findPoster(f);
        POSTERS[f.id] = r; if (r) RUN.found++;
      } catch (e) {
        RUN.errors++; RUN.lastError = e.message;
        if (/clé|joindre/.test(e.message)) RUN.stop = true;

    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);

  toast(RUN.stop && RUN.done < RUN.total ? 'Recherche arrêtée : ' + RUN.found + ' affiche' + (RUN.found > 1 ? 's' : '') + ' trouvée' + (RUN.found > 1 ? 's' : '') + '.' : 'Terminé : ' + RUN.found + ' affiche' + (RUN.found > 1 ? 's' : '') + ' trouvée' + (RUN.found > 1 ? 's' : '') + ' sur ' + RUN.total + '.');
  if (route().name === 'catalogue') paintCatGrid();
}

async function exLoad() {

    let data;

      data = await tmdb('/search/' + EX.kind, {query: EX.q.trim(), language: 'fr-FR', page: EX.page, include_adult: 'false'});

      ${S.tmdbKey && !isBook(f) ? `<button type="button" class="btn" data-act="complete" data-id="${h(f.id)}">${ICON.cloud}${f.tmdbId ? 'Actualiser depuis TMDB' : 'Compléter avec TMDB'}</button>` : ''}

    </div>
    <div class="film-main">

        <p class="meta">${metaBits}${f.director ? `${metaBits ? ' · ' : ''}${isBook(f) ? 'De' : isSeries(f) ? 'Réalisation' : 'Réalisé par'} <a href="#" data-act="search" data-v="${h(f.director)}">${h(f.director)}</a>` : ''}${f.publisher ? ' · ' + h(f.publisher) : ''}${f.coll && f.coll !== 'Magazine' ? ', collection « ' + h(f.coll) + ' »' : ''}${isBook(f) && f.volumes > 1 ? ' · ' + f.volumes + ' tomes' : ''}</p>

      <div class="panel">
        ${isBook(f) ? '' : `<div style="display:flex;flex-direction:column;gap:4px"><span class="label">Note TMDB</span><span class="bignum">${f.tmdbNote ? fmtNote(f.tmdbNote) : '–'}<small> / 10</small></span></div>`}
        <div style="display:flex;flex-direction:column;gap:6px"><span class="label">${kid ? 'Note de ' + h(kid.name) : 'Ma note'}</span>
          <div class="stars" role="group" aria-label="Note">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star" data-act="star" data-v="${n}" aria-label="${n} étoile${n > 1 ? 's' : ''}" aria-pressed="${noteOf(f) >= n}">${starSvg(noteOf(f) >= n)}</button>`).join('')}</div>
        </div>
        ${!kid && f.status === 'vu' ? `<label class="field"><span>${W(f).le}</span><input class="inp" type="date" id="watched" value="${h(f.watchedDate)}" data-ch="watched" style="width:auto"></label>` : ''}
      </div>

        <button type="button" class="btn ${stOf(f) === 'avoir' ? 'wait' : ''}" data-act="status" data-v="avoir" aria-pressed="${stOf(f) === 'avoir'}">${ICON.clock}${W(f).avoir}</button>

        <button type="button" class="btn ${f.owned ? 'primary' : ''}" data-act="owned" aria-pressed="${f.owned}">${ICON.disc}${f.owned ? (isBook(f) ? 'On l\'a à la maison' : 'Je le possède') : (isBook(f) ? 'Pas à la maison' : 'Je ne le possède pas')}</button>
        ${f.owned ? `<label class="inline" for="support">Support <select class="sel" id="support" data-ch="support"><option value="">Choisir…</option>${SUPPORTS.map(s => `<option ${f.support === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}
      </div>
      ${quizBox(f)}
      <div style="display:flex;flex-direction:column;gap:8px"><h2 class="label">Résumé${f.synLang === 'en' ? ' <span style="text-transform:none;letter-spacing:0;font-weight:400">(en anglais)</span>' : ''}</h2>
        <p class="synopsis" ${f.synLang === 'en' ? 'lang="en"' : ''}>${f.synopsis ? h(f.synopsis) : '<span class="muted">Pas encore de résumé. ' + (S.tmdbKey && !IS_WEB ? 'Clique sur « Compléter avec TMDB » ou écris-le' : 'Écris-le') + ' avec « Modifier la fiche ».</span>'}</p>
        <div class="links">${links}</div></div>
      ${f.cast.length ? `<div style="display:flex;flex-direction:column;gap:10px"><h2 class="label">Voix et distribution (version originale)</h2><div class="cast">
        ${f.cast.map(c => `<button type="button" class="person" data-act="search" data-v="${h(c.name)}" title="Voir ses titres dans ma base"><span class="ini">${h(initials(c.name))}</span><span><b>${h(c.name)}</b>${c.role ? `<i>${h(c.role)}</i>` : ''}</span></button>`).join('')}
      </div></div>` : ''}
      ${kidsBox(f)}
      ${sagaBox(f)}
      ${f.vf ? `<div style="display:flex;flex-direction:column;gap:10px"><h2 class="label">Voix françaises</h2><div class="cast">
        ${f.vf.split('|').map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(.*?)\s*\((.*)\)$/); const nm = m ? m[1] : x; return `<button type="button" class="person" data-act="search" data-v="${h(nm)}" title="Voir ses titres dans ma base"><span class="ini">${h(initials(nm))}</span><span><b>${h(nm)}</b>${m ? `<i>${h(m[2])}</i>` : ''}</span></button>`; }).join('')}
      </div></div>` : ''}
      ${isBook(f) ? tomesBox(f) + bookBox(f) : watchBox(f) + musicBox(f)}
      ${f.owned ? loanBox(f) : ''}
      <div class="two">
        ${isBook(f) ? '' : `<div><h2 class="label">Où le regarder en France</h2>
          <p style="margin:0;color:var(--soft)">${f.providers ? h(f.providers) : '<span class="muted">' + (f.tmdbId ? 'Aucune plateforme répertoriée pour le moment.' : 'Information disponible après « Compléter avec TMDB ».') + '</span>'}</p>
          ${f.providersLink ? `<a href="${h(f.providersLink)}" target="_blank" rel="noopener">Voir le détail sur TMDB</a>` : ''}</div>`}
        <div><h2 class="label">Mes listes</h2>
          ${S.lists.length ? S.lists.map(l => `<label class="check"><input type="checkbox" data-ch="inlist" value="${h(l.id)}" ${l.ids.includes(f.id) ? 'checked' : ''}>${h(l.name)}</label>`).join('') : '<span class="muted">Aucune liste.</span>'}
          <a href="#/listes">Gérer mes listes</a></div>
      </div>
      <label class="field"><span class="label">Mes notes personnelles</span>
        <textarea class="inp" id="mynotes" rows="4" data-ch="notes" placeholder="Ex. vu avec les enfants, édition collector, chanson préférée…">${h(f.notes)}</textarea></label>
    </div>
  </div></div>`;
}

  const f = id ? byId(id) : blankFilm();

    <form id="ed-form" class="form" novalidate>
      <label class="field full"><span>Titre (obligatoire) — film, série, BD ou livre</span><input class="inp" id="e-title" value="${h(f.title)}" required></label>

      <label class="field"><span>Collection (livres)</span><input class="inp" id="e-coll" value="${h(f.coll || '')}" placeholder="Bibliothèque rose"></label>
      <label class="field"><span>Nombre de tomes</span><input class="inp" id="e-volumes" inputmode="numeric" value="${h(f.volumes || '')}" placeholder="24"></label>
      <label class="field"><span>Pays</span><input class="inp" id="e-country" value="${h(f.country)}" placeholder="France"></label>
      <label class="field"><span>Studio / univers</span><select class="sel" id="e-sub">${SUB_LIST.map(s => `<option ${f.subgenre === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="field"><span>Technique</span><select class="sel" id="e-tech">${TECHS.map(s => `<option ${(f.technique || 'Non précisé') === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="field"><span>Pour qui</span><select class="sel" id="e-pub">${PUBLICS.map(s => `<option ${(f.public || 'Famille') === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="field"><span>Durée (minutes)</span><input class="inp" id="e-run" inputmode="numeric" value="${h(f.runtime || '')}" placeholder="81"></label>
      <label class="field"><span>Âge conseillé</span><select class="sel" id="e-age">${[3, 6, 8, 10, 12, 16].map(a => `<option value="${a}" ${(f.age || 6) === a ? 'selected' : ''}>Dès ${a} ans</option>`).join('')}</select></label>
      <label class="field"><span>Récompenses</span><input class="inp" id="e-awards" value="${h(f.awards || '')}" placeholder="Oscar du meilleur film d'animation"></label>

function closeEditor() { $('#modal-root').innerHTML = ''; editingId = null; }
function saveEditor() {
  const v = (id) => $(id).value.trim();
  const title = v('#e-title'), year = v('#e-year'), run = v('#e-run'), end = v('#e-end');
  const err = $('#e-err');
  if (!title) { err.textContent = 'Indique au moins le titre.'; $('#e-title').focus(); return; }
  if (year && !/^(18|19|20)\d\d$/.test(year)) { err.textContent = "L'année doit avoir 4 chiffres, par exemple 1966."; $('#e-year').focus(); return; }
  if (end && (!/^(18|19|20)\d\d$/.test(end) || (year && +end < +year))) { err.textContent = "L'année de fin doit avoir 4 chiffres et venir après l'année de début."; $('#e-end').focus(); return; }
  if (run && !/^\d{1,3}$/.test(run)) { err.textContent = 'La durée doit être un nombre de minutes, par exemple 161.'; $('#e-run').focus(); return; }
  const cast = $('#e-cast').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.split(/\s+[—–-]\s+/);
    return {name: m[0].trim(), role: (m.slice(1).join(' - ') || '').trim()};
  });
  const data = {title, originalTitle: v('#e-orig'), year, director: v('#e-dir'), country: v('#e-country'), subgenre: $('#e-sub').value,
    technique: $('#e-tech').value, public: $('#e-pub').value, age: +$('#e-age').value, awards: v('#e-awards'), vf: v('#e-vf'), publisher: v('#e-publisher'), coll: v('#e-coll'), volumes: Math.min(+v('#e-volumes') || 0, 300) || null,
    runtime: run ? +run : null, cast, synopsis: v('#e-syn'), poster: v('#e-poster'), trailer: v('#e-trailer'), type: $('#e-type').value, endYear: end, pd: $('#e-pd').checked};
  let f;
  if (editingId) {
    f = byId(editingId);
    if (data.synopsis !== f.synopsis) data.synLang = '';
    Object.assign(f, data); HAY.delete(f.id);
  }
  else { f = Object.assign(blankFilm(), data); S.films.push(f); }
  save(); closeEditor();
  toast(editingId ? 'Fiche enregistrée' : '« ' + f.title + ' » ajouté à ta base');
  if (location.hash === '#/film/' + f.id) render(); else location.hash = '#/film/' + f.id;
}

/* =========================================================
   Vue : Ma collection
   ========================================================= */
function viewCollection() {
  const kid = activeKid();
  const vus = S.films.filter(f => stOf(f) === 'vu'), avoir = S.films.filter(f => stOf(f) === 'avoir'), own = S.films.filter(f => f.owned);
  const loans = S.films.filter(f => f.loan && f.loan.to), favs = kid ? S.films.filter(f => favOf(f)) : [];
  const oldLoans = loans.filter(f => f.loan.date && (Date.now() - new Date(f.loan.date).getTime()) > 30 * 86400000);
  const known = vus.filter(f => f.runtime);
  const mins = known.reduce((a, f) => a + f.runtime, 0);
  const tabs = [['tous', 'Tous'], ['vu', 'Vus'], ['avoir', 'À voir'], ['own', 'Possédés'], ['pret', 'Prêtés (' + loans.length + ')']].concat(kid ? [['fav', 'Coups de cœur (' + favs.length + ')']] : []);
  let rows = S.films.filter(f => stOf(f) || f.owned);
  if (UI.colTab === 'vu') rows = vus; else if (UI.colTab === 'avoir') rows = avoir; else if (UI.colTab === 'own') rows = own; else if (UI.colTab === 'pret') rows = loans; else if (UI.colTab === 'fav') rows = favs;
  rows = rows.slice().sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  const stars = (n) => n ? '★'.repeat(n) + '☆'.repeat(5 - n) : '–';
  return `<div class="layout"><section class="content">
    <div class="head-row"><h1 class="title">${kid ? 'Collection de ' + h(kid.name) : 'Ma collection'}</h1>
      <div class="row"><a class="btn primary" href="#/series">Mes séries de livres et BD</a><a class="btn" href="#/scanner">Scanner un DVD ou un livre</a><a class="btn" href="#/imprimer">${ICON.dl}Catalogue imprimable</a>
      <button type="button" class="btn" data-act="csv">${ICON.dl}Exporter vers Excel</button></div></div>
    <div class="tiles"><div class="tile"><span class="label">Dessins animés à la maison</span><span class="bignum">${own.filter(f => !isBook(f)).length}</span></div><div class="tile"><span class="label">BD et livres à la maison</span><span class="bignum">${own.filter(isBook).length}</span><small>${own.filter(isBook).reduce((a, f) => a + Math.max((f.vols || []).length, 1), 0)} volumes</small></div></div>
    ${oldLoans.length ? `<div class="loanwarn"><b>Prêts à récupérer :</b> ${oldLoans.map(f => `<a href="#/film/${h(f.id)}" style="color:var(--fg)">${h(f.title)}</a> (${h(f.loan.to)}, depuis le ${fmtDate(f.loan.date)})`).join(' · ')}</div>` : ''}
    <div class="tiles">
      <div class="tile"><span class="label">Vus ou lus</span><span class="bignum">${vus.length}</span></div>
      <div class="tile"><span class="label">À voir</span><span class="bignum">${avoir.length}</span></div>
      <div class="tile"><span class="label">Possédés</span><span class="bignum">${own.length}</span></div>
      <div class="tile"><span class="label">Heures de dessins animés</span><span class="bignum">${(mins / 60).toLocaleString('fr-FR', {maximumFractionDigits: 1})}</span>
        <small>${vus.length ? `durée connue pour ${known.length} film${known.length > 1 ? 's' : ''} vu${known.length > 1 ? 's' : ''} sur ${vus.length}` : 'aucun film vu'}</small></div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" class="tab ${UI.colTab === k ? 'on' : ''}" aria-selected="${UI.colTab === k}" data-act="coltab" data-v="${k}">${l}</button>`).join('')}</div>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Titre</th><th>Statut</th><th>Support</th><th>${kid ? 'Sa note' : 'Ma note'}</th><th>${UI.colTab === 'pret' ? 'Prêté à' : 'Vu le'}</th></tr></thead><tbody>
      ${rows.map(f => `<tr class="clk" data-act="open" data-id="${h(f.id)}"><td><a class="cellfilm" href="#/film/${h(f.id)}" style="color:var(--fg);text-decoration:none">
        ${posterOf(f) ? `<img class="thumb" src="${h(posterOf(f))}" alt="">` : `<span class="thumb" style="background:${tone(f)}"></span>`}
        <span><b style="display:block">${h(f.title)}</b><span class="muted" style="font-size:13px">${h(f.year || '?')} · ${h(f.director || '')}</span></span></a></td>
        <td>${stOf(f) === 'vu' ? '<span class="badge vu">Vu</span>' : stOf(f) === 'avoir' ? '<span class="badge avoir">À voir</span>' : '<span class="muted">–</span>'}</td>
        <td>${f.owned ? h(f.support || 'Possédé') : '<span class="muted">–</span>'}</td>
        <td style="color:var(--accent-soft);letter-spacing:2px">${stars(noteOf(f))}</td>
        <td class="muted">${UI.colTab === 'pret' && f.loan ? h(f.loan.to) + ' · ' + fmtDate(f.loan.date) : (kid ? fmtDate(kidRec(f, kid).d) : fmtDate(f.watchedDate)) || '–'}</td></tr>`).join('')}
      </tbody></table></div>` :
      `<div class="empty"><h2>Rien ici pour l'instant</h2><p>Ouvre un film du catalogue et clique sur « Vu », « À voir » ou « Je le possède » : il apparaîtra ici.</p><a class="btn primary" href="#/catalogue">Parcourir le catalogue</a></div>`}
  </section>
  <aside class="listnav" aria-label="Mes listes"><h2 class="label">Mes listes</h2>
    ${S.lists.map(l => `<a class="listlink" href="#/listes/${h(l.id)}"><span>${h(l.name)}</span><span>${l.ids.length} film${l.ids.length > 1 ? 's' : ''}</span></a>`).join('')}

  </aside></div>`;
}
function exportCsv(all) {
  const cols = ['Titre', 'Titre original', 'Type', 'Année', 'Année de fin', 'Réalisation', 'Pays', 'Studio', 'Technique', 'Pour qui', 'Durée (min)', 'Statut', 'Possédé', 'Support', 'Ma note (/5)', 'Vu le', 'Note TMDB', 'Listes', 'Acteurs', 'Mes notes'];
  const q = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [cols.join(';')];
  const inList = new Set(S.lists.flatMap(l => l.ids));
  const rows = all ? S.films : S.films.filter(f => f.status || f.owned || f.myNote || f.notes || inList.has(f.id));
  rows.slice().sort((a, b) => a.title.localeCompare(b.title, 'fr')).forEach(f => {
    lines.push([f.title, f.originalTitle, f.type || 'Film', f.year, f.endYear, f.director, f.country, f.subgenre, f.technique || '', f.public || '', f.runtime || '',
      f.status === 'vu' ? 'Vu' : f.status === 'avoir' ? 'À voir' : '', f.owned ? 'Oui' : 'Non', f.owned ? f.support : '',
      f.myNote || '', fmtDate(f.watchedDate), fmtNote(f.tmdbNote), S.lists.filter(l => l.ids.includes(f.id)).map(l => l.name).join(', '),
      f.cast.map(c => c.name).join(', '), f.notes].map(q).join(';'));
  });
  if (lines.length === 1) { toast('Ta collection est vide : rien à exporter pour l\'instant.'); return; }
  download((all ? 'toons-et-bulles-catalogue-' : 'toons-et-bulles-collection-') + today() + '.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8').then(ok => { if (ok) toast('Fichier Excel (CSV) téléchargé'); });
}
async function download(name, text, type) {
  if (IS_WEB) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast("Le téléchargement n'est pas disponible sur cette page."); return false; }
    try { await dl.save({filename: name, data: text}); return true; }
    catch (e) { if (e && e.code !== 'declined') toast('Téléchargement impossible : ' + (e.message || e.code)); return false; }
  }
  const b = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

function bars(entries, max) {
  if (!entries.length) return '<p class="muted">Pas encore de données.</p>';
  const m = max || Math.max(...entries.map(e => e[1]), 1);
  return `<div class="bars">${entries.map(([k, v]) => `<div class="bar"><span>${h(k)}</span><div class="track"><div class="fill" style="width:${(v / m * 100).toFixed(1)}%"></div></div><span class="v">${v.toLocaleString('fr-FR')}</span></div>`).join('')}</div>`;
}
function countBy(list, fn) {
  const m = new Map();
  list.forEach(f => [].concat(fn(f)).filter(Boolean).forEach(k => m.set(k, (m.get(k) || 0) + 1)));
  return [...m.entries()];
}
function viewStats() {
  const vus = S.films.filter(f => f.status === 'vu');
  const dec = countBy(vus, f => decadeOf(f.year) ? decadeOf(f.year) + 's' : null).sort((a, b) => a[0].localeCompare(b[0]));
  const decAll = countBy(S.films, f => decadeOf(f.year) ? decadeOf(f.year) + 's' : null).sort((a, b) => a[0].localeCompare(b[0]));
  const typeAll = countBy(S.films, f => TYPE_PLURAL[f.type || 'Film'] || f.type).sort((a, b) => b[1] - a[1]);
  const subAll = countBy(S.films, f => f.subgenre).sort((a, b) => b[1] - a[1]);
  const sub = countBy(vus, f => f.subgenre).sort((a, b) => b[1] - a[1]);
  const techAll = countBy(S.films, f => f.technique || 'Non précisé').sort((a, b) => b[1] - a[1]);
  const dirs = countBy(vus, f => (f.director || '').split(/,\s*| et /).map(s => s.trim())).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8);
  const actors = countBy(vus, f => f.cast.map(c => c.name)).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8);
  const pct = S.films.length ? Math.round(vus.length / S.films.length * 100) : 0;
  const noted = vus.filter(f => f.myNote);
  const avg = noted.length ? noted.reduce((a, f) => a + f.myNote, 0) / noted.length : 0;
  return `<div style="display:flex;flex-direction:column;gap:24px">
    <h1 class="title">Statistiques</h1>
    <div class="tiles">
      <div class="tile"><span class="label">Vus ou lus</span><span class="bignum">${vus.length}<small> / ${S.films.length.toLocaleString('fr-FR')}</small></span><small>${pct} % de ta base</small></div>
      <div class="tile"><span class="label">Ma note moyenne</span><span class="bignum">${noted.length ? fmtNote(avg) : '–'}<small> / 5</small></span><small>sur ${noted.length} film${noted.length > 1 ? 's' : ''} noté${noted.length > 1 ? 's' : ''}</small></div>
      <div class="tile"><span class="label">Possédés</span><span class="bignum">${S.films.filter(f => f.owned).length}</span></div>
      <div class="tile"><span class="label">Listes</span><span class="bignum">${S.lists.length}</span></div>
    </div>
    ${vus.length ? '' : '<div class="note-box">Les graphiques « vus » se remplissent quand tu marques des titres comme « Vu ».</div>'}
    <div class="cols">
      <div class="box"><h2>Titres vus par décennie</h2>${bars(dec)}</div>
      <div class="box"><h2>Titres vus par studio</h2>${bars(sub)}</div>
      <div class="box"><h2>Réalisateurs les plus vus</h2>${bars(dirs)}</div>
      <div class="box"><h2>Voix les plus entendues</h2>${bars(actors)}</div>
      <div class="box"><h2>Ma base par décennie</h2>${bars(decAll)}</div>
      <div class="box"><h2>Ma base par type</h2>${bars(typeAll)}</div>
      <div class="box"><h2>Ma base par studio</h2>${bars(subAll)}</div>
      <div class="box"><h2>Ma base par technique</h2>${bars(techAll)}</div>
      <div class="box"><h2>Titres vus par enfant</h2>${bars(KIDS().map(k => [k.name, S.films.filter(f => stOf(f, k) === 'vu').length]))}</div>
      <div class="box"><h2>Ma base par âge conseillé</h2>${bars([3, 6, 8, 10, 12, 16].map(a => ['Dès ' + a + ' ans', S.films.filter(f => (f.age || 6) === a).length]))}</div>
    </div></div>`;
}

  add(`Qu'est-ce que ${T} ?`, pick3(typeLabel(f.type), (book ? BOOK_TYPES : ['Film', 'Série', 'Mini-série', 'Téléfilm / spécial', 'Court métrage']).filter(t => t !== f.type).map(typeLabel)));
  if (f.synopsis && f.synopsis.length > 50) {

    const m = shuffle(vf)[0];

    add(`Qui fait la voix française de ${m2[2]} dans ${T} ?`, pick3(m2[1], pool.flatMap(x => (x.vf || '').split('|').map(v => (v.match(/^(.*?)\s*\(/) || [])[1])).filter(n => n && !vf.some(z => z[1] === n))));

function statsFor(pid) {
  const s = {passed: 0, stars: 0, perfect: 0, disney: 0, pixar: 0, bd: 0, livre: 0, retro: 0, played: 0};
  S.films.forEach(f => {
    const b = bestOf(f, pid); if (!b) return; s.played++;
    if (b >= 5) s.passed++; if (b >= 10) s.perfect++; s.stars += starsFor(b);
    if (b >= 7) { if (f.subgenre === 'Disney') s.disney++; if (f.subgenre === 'Pixar') s.pixar++; if (kindOf(f) === 'bd') s.bd++; if (kindOf(f) === 'livre') s.livre++; if (f.subgenre === 'Animés et style japonais' || (isSeries(f) && +f.year && +f.year < 1990)) s.retro++; }

}

/* =========================================================
   Séries de livres : liste des titres, cases « On l'a » / « Lu », mes séries (1.7.0)
   ========================================================= */
const TITLES_DB = window.CT_TITLES || {};
const isSeriesBook = (f) => f.type === 'Série de livres' || f.type === 'Série de BD';
/* Titre du n-ième livre : ajouté par moi (f.xt), sinon liste fournie */
function seriesInfo(f) {
  const groups = TITLES_DB[f.id] || [];
  const flat = []; groups.forEach(([g, list]) => list.forEach(t => flat.push({t, g})));
  const xt = f.xt && typeof f.xt === 'object' ? f.xt : {};
  const xmax = Object.keys(xt).reduce((m, k) => Math.max(m, +k || 0), 0);
  const total = Math.max(+f.volumes || 0, flat.length, xmax);
  const items = Array.from({length: total}, (_, i) => {
    const n = i + 1, base = flat[i];
    return {n, t: xt[n] || (base ? base.t : ''), g: base ? base.g : (xmax && n > flat.length ? 'Ajoutés par moi' : ''), mine: !!xt[n]};
  });
  return {items, total, titled: flat.length > 0 || xmax > 0};
}
const readSet = (f, k = activeKid()) => new Set(k ? (kidRec(f, k).vl || []) : (f.readVols || []));
const SER = {filter: 'tous', q: '', fid: '', props: null, loading: false, err: ''};

  const {items} = seriesInfo(f), own = new Set(f.vols || []), rd = readSet(f), k = activeKid();
  const q = norm(SER.q.trim());

  if (SER.filter === 'manquants') list = list.filter(it => !own.has(it.n));
  else if (SER.filter === 'nonlus') list = list.filter(it => !rd.has(it.n));
  if (q) list = list.filter(it => norm(it.t).includes(q) || String(it.n) === q);
  if (!list.length) return '<p class="muted" style="margin:0">Aucun livre ne correspond.</p>';
  let lastG = null;
  return `<ol class="ser-list">${list.map(it => {
    const head = it.g && it.g !== lastG ? `<li class="ser-g">${h(it.g)}</li>` : ''; lastG = it.g;
    return head + `<li class="ser-row ${own.has(it.n) ? 'have' : ''}"><span class="ser-n">${it.n}</span><span class="ser-t">${it.t ? h(it.t) : '<span class="muted">Tome ' + it.n + '</span>'}${it.mine ? ` <button type="button" class="linkbtn" data-act="ser-del" data-v="${it.n}" title="Retirer ce titre ajouté">retirer</button>` : ''}</span>
      <button type="button" class="chip ${own.has(it.n) ? 'on' : ''}" data-act="vol-own" data-v="${it.n}" aria-pressed="${own.has(it.n)}">On l'a</button>

  }).join('')}</ol>`;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function tomesBox(f) {

  const {items, total, titled} = seriesInfo(f);
  const own = (f.vols || []).filter(n => n <= total), rd = [...readSet(f)].filter(n => n <= total), k = activeKid();
  const next = total + 1;
  const addForm = `<form id="ser-add-form" class="row" style="align-items:flex-end">

async function serFromGoogle(f) {
  const base = cleanTitle(f.title).replace(/\s*\((livres|BD)\)$/i, '');

  for (const q of queries) {
    const res = await gbooks(q, 40);
    res.forEach(b => {
      if (b.lang && b.lang !== 'fr') return;
      const full = (b.title + (b.subtitle ? ' : ' + b.subtitle : '')).replace(/\s+/g, ' ').trim();
      const sameSeries = tkey(full).includes(key) || (author && norm(b.authors).includes(norm(author)));
      if (!sameSeries) return;
      let t = b.subtitle && tkey(b.title) === key ? b.subtitle : b.title;
      t = t.replace(/^\s*(tome|t\.)\s*\d+\s*[-:.]?\s*/i, '').trim();
      if (!t || tkey(t) === key || t.length > 120) return;
      const tk = tkey(t); if (have.has(tk) || seen.has(tk)) return;
      seen.add(tk); out.push({t, n: tomeGuess(full) || 0, y: b.year});
    });
    if (out.length >= 30) break;
  }
  return out.sort((a, b) => (a.n || 999) - (b.n || 999) || (a.y || '').localeCompare(b.y || '')).slice(0, 60);
}

  if (!num || (info.items[num - 1] && info.items[num - 1].t && !info.items[num - 1].mine)) {
    const free = info.items.find(it => !it.t); num = free ? free.n : info.total + 1;
  }
  f.xt = Object.assign({}, f.xt || {}, {[num]: String(t).trim().slice(0, 140)});
  return num;
}
